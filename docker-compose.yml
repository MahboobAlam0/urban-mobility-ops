version: '3.8'
# Local MySQL for the pipeline. The SQL in sql/ is MySQL-specific, and the
# scripts' default connection string (CITIBIKE_DB_URL) points here:
# mysql+pymysql://root:toor@localhost:3306/citibike
services:
  mysql:
    image: mysql:8.0
    container_name: citibike_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-toor}
      MYSQL_DATABASE: citibike
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
